name: Deploy download page

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Mirror the latest update manifest
        run: |
          UPDATE_URL="https://github.com/${GITHUB_REPOSITORY}"
          UPDATE_URL="${UPDATE_URL}/releases/latest/download/update.json"
          curl --fail --location --retry 5 --retry-all-errors \
            "$UPDATE_URL" --output docs/site/update.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: >-
          actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: docs/site
      - id: deployment
        uses: >-
          actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
